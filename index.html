<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>時間電卓</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg: #121214;
    --text: #f5f5f5;
    --sub: #9a9a9f;
    --line: #333336;
    --btn-bg: #121214;
    --btn-hover: #f5f5f5;
    --btn-hover-text: #121214;
    --accent: #ff6a33;
    --accent-bg: rgba(255, 106, 51, 0.12);
    --display-bg: #0a0a0b;
  }
  :root[data-theme="light"] {
    --bg: #fafafa;
    --text: #17171a;
    --sub: #6b6b70;
    --line: #dcdcdc;
    --btn-bg: #ffffff;
    --btn-hover: #17171a;
    --btn-hover-text: #ffffff;
    --accent: #e05420;
    --accent-bg: rgba(224, 84, 32, 0.08);
    --display-bg: #ffffff;
  }
  * { box-sizing: border-box; touch-action: manipulation; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .top-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .theme-toggle {
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--btn-bg);
    color: var(--sub);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .theme-toggle:active { background: var(--btn-hover); color: var(--btn-hover-text); }
  .app {
    width: 100%;
    max-width: 380px;
    padding: 20px 16px;
  }
  h1 {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin: 0 0 6px;
  }
  .hint {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--sub);
    margin: 0 0 18px;
    min-height: 16px;
  }
  .display {
    background: var(--display-bg);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 20px 16px;
    margin-bottom: 16px;
  }
  .expr {
    text-align: right;
    font-size: 14px;
    letter-spacing: 0.01em;
    color: var(--sub);
    min-height: 17px;
    margin-bottom: 8px;
  }
  .current {
    text-align: right;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.02em;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .sub-total {
    text-align: right;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--sub);
    min-height: 14px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  button {
    border: none;
    border-radius: 0;
    font-size: 18px;
    padding: 18px 0;
    cursor: pointer;
    color: var(--text);
    background: var(--btn-bg);
    transition: background 100ms, color 100ms;
    font-family: inherit;
  }
  button:active { background: var(--btn-hover); color: var(--btn-hover-text); }
  button.unit {
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0.03em;
  }
  button.op {
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 700;
    font-size: 19px;
  }
  button.op.active {
    background: var(--accent);
    color: #000;
  }
  button.func {
    color: var(--sub);
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  button.eq {
    background: var(--text);
    color: var(--bg);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.08em;
  }
  button.eq:active { background: var(--accent); color: #000; }
  button.zero {
    grid-column: span 2;
  }
  .detail-toggle {
    display: none;
    margin-bottom: 16px;
  }
  .detail-toggle button {
    width: 100%;
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 12px 0;
  }
  .detail-toggle button:active { background: var(--btn-hover); color: var(--btn-hover-text); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    align-items: stretch;
    justify-content: stretch;
    padding: 0;
    z-index: 10;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal {
    background: var(--bg);
    border: none;
    border-radius: 0;
    width: 100%;
    max-width: none;
    height: 100%;
    max-height: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--line);
  }
  .modal-header button {
    background: transparent;
    padding: 4px 8px;
    font-size: 18px;
    color: var(--sub);
  }
  .modal-formula {
    padding: 12px 20px;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--sub);
    border-bottom: 1px solid var(--line);
    min-height: 18px;
  }
  .modal-start {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .modal-start label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .modal-start input {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    background: var(--btn-bg);
    border: 1px solid var(--line);
    border-radius: 0;
    color: var(--text);
    font-size: 20px;
    padding: 10px;
    font-family: inherit;
  }
  .modal-start input[type="time"] {
    color-scheme: dark;
  }
  :root[data-theme="light"] .modal-start input[type="time"] {
    color-scheme: light;
  }
  .adjust-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .adjust-row input { width: auto; flex: 1; }
  .adjust-row span {
    color: var(--sub);
    font-size: 15px;
  }
  .modal-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 24px;
  }
  .detail-row {
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .detail-row .detail-label {
    flex: 0 0 auto;
    color: var(--sub);
    font-size: 13px;
    letter-spacing: 0.04em;
    width: 3.5em;
  }
  .detail-row .detail-time {
    flex: 1;
    text-align: right;
    font-size: 24px;
    font-weight: 700;
  }
  .detail-row .detail-time-plus {
    flex: 1;
    text-align: right;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
  }
  .detail-row-formula {
    text-align: left;
    margin-left: calc(3.5em + 10px);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-top: 6px;
  }
  .detail-row-adj {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
  }
  .detail-row-adj .adj-pm {
    font-size: 15px;
    color: var(--sub);
  }
  .detail-row-adj input {
    width: 72px;
    background: var(--btn-bg);
    border: 1px solid var(--line);
    border-radius: 0;
    color: var(--text);
    font-size: 17px;
    padding: 9px 4px;
    text-align: center;
    font-family: inherit;
  }
  .detail-row-adj input:not(:placeholder-shown) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .detail-row-adj .adj-unit {
    font-size: 13px;
    color: var(--sub);
  }
  .detail-row-adj .adj-sign {
    font-size: 14px;
    color: var(--accent);
    min-width: 3.8em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <button class="theme-toggle" id="btn-theme">DARK</button>
  </div>
  <h1>時間電卓</h1>
  <div class="hint" id="hint"></div>

  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="current" id="current">0</div>
    <div class="sub-total" id="sub-total"></div>
  </div>

  <div class="detail-toggle" id="detail-toggle">
    <button id="btn-detail">詳細を見る（各回の完了時刻）</button>
  </div>

  <div class="keypad">
    <button class="unit" id="btn-h">時</button>
    <button class="unit" id="btn-m">分</button>
    <button class="unit" id="btn-s">秒</button>
    <button class="func" id="btn-clear">C</button>

    <button class="num">7</button>
    <button class="num">8</button>
    <button class="num">9</button>
    <button class="op" id="btn-div">÷</button>

    <button class="num">4</button>
    <button class="num">5</button>
    <button class="num">6</button>
    <button class="op" id="btn-mul">×</button>

    <button class="num">1</button>
    <button class="num">2</button>
    <button class="num">3</button>
    <button class="op" id="btn-sub">−</button>

    <button class="num zero">0</button>
    <button class="func" id="btn-back">⌫</button>
    <button class="op" id="btn-add">+</button>

    <button class="eq" id="btn-eq" style="grid-column: span 4;">=</button>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span>各回の完了時刻</span>
      <button id="modal-close">✕</button>
    </div>
    <div class="modal-formula" id="modal-formula"></div>
    <div class="modal-start">
      <label>開始時刻</label>
      <input type="time" id="detail-start">
    </div>
    <div class="modal-start">
      <label>◯分後の時刻も表示（例: 熟成時間）</label>
      <div class="adjust-row">
        <input type="number" id="detail-adjust" placeholder="0">
        <span>分</span>
      </div>
    </div>
    <div class="modal-list" id="detail-list"></div>
  </div>
</div>

<script>
  const themeBtn = document.getElementById('btn-theme');
  const savedTheme = localStorage.getItem('time-calc-theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(savedTheme);

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? 'DARK' : 'LIGHT';
    localStorage.setItem('time-calc-theme', theme);
  }

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  const exprEl = document.getElementById('expr');
  const currentEl = document.getElementById('current');
  const hintEl = document.getElementById('hint');

  let raw = '';               // 単位未確定の入力中の数字
  let segAccum = 0;           // 現在組み立て中の値（秒、countのときは個数そのもの）
  let segStack = [];          // 単位ボタンで確定した量を順番に記録（⌫で1つずつ戻すため）
  let usedUnit = false;       // 今の入力で時/分/秒ボタンを1回でも押したか（押していなければ普通の数値として扱う）
  let accSec = null;          // 確定済みの1つ前の値（秒）
  let accType = null;         // 'duration' | 'time' | 'count'
  let pendingOp = null;       // '×' | '+'
  let entryType = 'duration'; // 今入力中の値の種類: 'duration' | 'time' | 'count'
  let historyText = '';       // 画面上部に残す計算過程
  let lastMultiply = null;    // 直前の「時間 × 回数」の内訳（詳細ボタン用）
  let rowAdjustments = [];    // 各回の個別調整（分）。その回以降に累積して反映される

  const HINTS = {
    duration: '時間を入力してください',
    time: '時刻を入力（例: 1→4→時 1→4→分）',
    count: '個数を入力してください'
  };

  const UNIT_LABEL = {
    duration: { h: '時間', m: '分', s: '秒' },
    time: { h: '時', m: '分', s: '秒' }
  };

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatEntryText(sec, r, type) {
    if (type === 'count') {
      if (r !== '') return r;
      return sec > 0 ? String(sec) : '';
    }
    const labels = UNIT_LABEL[type];
    const hh = Math.floor(sec / 3600);
    const mm = Math.floor((sec % 3600) / 60);
    const ss = sec % 60;
    let text = '';
    if (hh > 0) text += hh + labels.h;
    if (mm > 0) text += mm + labels.m;
    if (ss > 0) text += ss + labels.s;
    text += r;
    return text;
  }

  function formatResultText(sec, type) {
    sec = Math.round(sec);
    if (type === 'time') {
      sec = ((sec % 86400) + 86400) % 86400;
      const hh = Math.floor(sec / 3600);
      const mm = Math.floor((sec % 3600) / 60);
      const ss = sec % 60;
      return pad(hh) + ':' + pad(mm) + (ss ? ':' + pad(ss) : '');
    }
    if (type === 'count' || type === 'number') return String(sec);
    const hh = Math.floor(sec / 3600);
    const mm = Math.floor((sec % 3600) / 60);
    const ss = sec % 60;
    let text = '';
    if (hh > 0) text += hh + '時間';
    if (hh > 0 || mm > 0) text += mm + '分';
    text += ss + '秒';
    return text;
  }

  function formatClockKanji(sec) {
    sec = ((Math.round(sec) % 86400) + 86400) % 86400;
    const hh = Math.floor(sec / 3600);
    const mm = Math.floor((sec % 3600) / 60);
    const ss = sec % 60;
    let text = hh + '時' + mm + '分';
    if (ss > 0) text += ss + '秒';
    return text;
  }

  function flushRaw() {
    if (raw === '') return;
    if (entryType === 'count') {
      segAccum = parseInt(raw, 10);
    } else {
      segAccum += parseInt(raw, 10); // 単位ボタンを押さずに演算子/=を押した場合は「秒」扱い
    }
    raw = '';
  }

  function effectiveType(type, used) {
    // 時/分/秒ボタンを一度も使っていなければ、ただの数値として扱う
    if (type === 'count') return 'number';
    return used ? type : 'number';
  }

  function computeOp(op, first, firstType, second, secondType) {
    const bothNumber = firstType === 'number' && secondType === 'number';

    if (op === '×') {
      const type = firstType === 'number' ? 'number' : 'duration';
      return { value: Math.round(first * second), type };
    }
    if (op === '÷') {
      const type = firstType === 'number' ? 'number' : 'duration';
      const value = second === 0 ? 0 : first / second;
      return { value: Math.round(value), type };
    }
    if (op === '+') {
      if (bothNumber) return { value: first + second, type: 'number' };
      return { value: first + second, type: firstType }; // 時間+時間→時間、時刻+時間→時刻のまま
    }
    // op === '−'
    if (bothNumber) return { value: first - second, type: 'number' };
    let value = first - second;
    const type = firstType; // 時刻から引けば時刻、時間から引けば時間のまま
    if (type === 'duration') value = Math.max(0, value); // 時間はマイナスにしない
    return { value, type };
  }

  function updateDisplay() {
    exprEl.textContent = historyText;

    const entryText = formatEntryText(segAccum, raw, entryType);
    let displaySec = 0;
    let displayType = null;
    if (entryText !== '') {
      currentEl.textContent = entryText;
      displaySec = segAccum;
      displayType = effectiveType(entryType, usedUnit);
    } else if (pendingOp === null && accSec !== null) {
      currentEl.textContent = formatResultText(accSec, accType);
      displaySec = accSec;
      displayType = accType;
    } else {
      currentEl.textContent = '0';
    }

    document.getElementById('sub-total').textContent =
      (displayType === 'duration' && displaySec > 0)
        ? '合計 ' + Math.round(displaySec / 60) + '分'
        : '';

    hintEl.textContent = HINTS[entryType] || '';
    document.getElementById('btn-mul').classList.toggle('active', pendingOp === '×');
    document.getElementById('btn-div').classList.toggle('active', pendingOp === '÷');
    document.getElementById('btn-add').classList.toggle('active', pendingOp === '+');
    document.getElementById('btn-sub').classList.toggle('active', pendingOp === '−');
  }

  function reset() {
    raw = '';
    segAccum = 0;
    segStack = [];
    usedUnit = false;
    accSec = null;
    accType = null;
    pendingOp = null;
    entryType = 'duration';
    historyText = '';
    lastMultiply = null;
    rowAdjustments = [];
    updateDetailButton();
    updateDisplay();
  }

  function startFreshIfNeeded() {
    // 直前に = で結果が出た状態から新しく打ち始めたら計算をリセット
    if (pendingOp === null && accSec !== null && raw === '' && segAccum === 0) {
      accSec = null;
      accType = null;
      entryType = 'duration';
      historyText = '';
      segStack = [];
      usedUnit = false;
      lastMultiply = null;
      rowAdjustments = [];
      updateDetailButton();
    }
  }

  function pressDigit(d) {
    startFreshIfNeeded();
    if (raw.length >= 6) return;
    raw += d;
    updateDisplay();
  }

  function pressBack() {
    if (raw.length > 0) {
      raw = raw.slice(0, -1);
    } else if (segStack.length > 0) {
      const last = segStack.pop();
      segAccum -= last;
    }
    updateDisplay();
  }

  function pressUnitHour() {
    if (entryType === 'count') return;
    const amount = parseInt(raw || '0', 10) * 3600;
    segAccum += amount;
    segStack.push(amount);
    usedUnit = true;
    raw = '';
    updateDisplay();
  }
  function pressUnitMinute() {
    if (entryType === 'count') return;
    const amount = parseInt(raw || '0', 10) * 60;
    segAccum += amount;
    segStack.push(amount);
    usedUnit = true;
    raw = '';
    updateDisplay();
  }
  function pressUnitSecond() {
    if (entryType === 'count') return;
    const amount = parseInt(raw || '0', 10);
    segAccum += amount;
    segStack.push(amount);
    usedUnit = true;
    raw = '';
    updateDisplay();
  }

  function pressOp(op) {
    flushRaw();
    if (accSec === null) {
      accSec = segAccum;
      accType = effectiveType(entryType, usedUnit);
      historyText = formatResultText(accSec, accType) + ' ' + op;
    } else {
      historyText += ' ' + op;
    }
    pendingOp = op;
    segAccum = 0;
    segStack = [];
    usedUnit = false;
    raw = '';
    entryType = (op === '×' || op === '÷') ? 'count' : 'duration';
    updateDisplay();
  }

  function pressEqual() {
    if (pendingOp === null) return;
    flushRaw();
    const secondType = effectiveType(entryType, usedUnit);
    const secondText = formatResultText(segAccum, secondType);
    const op = pendingOp;
    const firstVal = accSec;
    const firstType = accType;

    const r = computeOp(op, firstVal, firstType, segAccum, secondType);
    accSec = r.value;
    accType = r.type;

    if (op === '×' && firstType === 'duration' && firstVal > 0 && segAccum > 0) {
      lastMultiply = { perSec: firstVal, count: Math.min(segAccum, 500) };
    } else if (accType === 'duration' && accSec > 0) {
      lastMultiply = { perSec: accSec, count: 1 };
    } else {
      lastMultiply = null;
    }
    rowAdjustments = lastMultiply ? new Array(lastMultiply.count).fill(0) : [];

    historyText += ' ' + secondText + ' = ' + formatResultText(accSec, accType);
    pendingOp = null;
    segAccum = 0;
    segStack = [];
    usedUnit = false;
    raw = '';
    entryType = accType === 'time' ? 'time' : 'duration';
    updateDetailButton();
    updateDisplay();
  }

  function updateDetailButton() {
    const label = lastMultiply && lastMultiply.count > 1
      ? '詳細を見る（各回の完了時刻）'
      : '終了時刻を計算する';
    document.getElementById('btn-detail').textContent = label;
    document.getElementById('detail-toggle').style.display = lastMultiply ? 'block' : 'none';
  }

  function renderDetailList() {
    const startVal = document.getElementById('detail-start').value;
    const listEl = document.getElementById('detail-list');
    if (!startVal || !lastMultiply) {
      listEl.innerHTML = '';
      return;
    }
    if (rowAdjustments.length !== lastMultiply.count) {
      rowAdjustments = new Array(lastMultiply.count).fill(0);
    }
    const adjustMin = parseInt(document.getElementById('detail-adjust').value, 10) || 0;
    const [hh, mm] = startVal.split(':').map(Number);
    const t0 = hh * 3600 + mm * 60; // 開始時刻（これより前にはならない下限）
    let t = t0;
    let cumulativeAdj = 0;
    let html = '';
    for (let i = 1; i <= lastMultiply.count; i++) {
      t += lastMultiply.perSec;
      const originalRowT = t + cumulativeAdj; // この回の調整を反映する前の予定時刻
      const thisAdjMin = rowAdjustments[i - 1] || 0;
      cumulativeAdj += thisAdjMin * 60;
      const minAllowed = t0 - t; // 開始時刻より前に行かないようにする下限
      if (cumulativeAdj < minAllowed) cumulativeAdj = minAllowed;
      const rowT = t + cumulativeAdj; // この回の調整を反映した後の時刻
      const label = lastMultiply.count > 1 ? i + '回目' : '終了時刻';

      const plusText = adjustMin
        ? '<span class="detail-time-plus">→ ' + formatClockKanji(rowT + adjustMin * 60) + '</span>'
        : '';
      const formulaHtml = thisAdjMin !== 0
        ? '<div class="detail-row-formula">' + formatClockKanji(originalRowT) + ' ' +
          (thisAdjMin > 0 ? '+' : '') + thisAdjMin + '分 適用</div>'
        : '';
      const signText = thisAdjMin > 0 ? '+' + thisAdjMin + '分' : thisAdjMin < 0 ? thisAdjMin + '分' : '';
      const adjInput = lastMultiply.count > 1
        ? '<div class="detail-row-adj"><span class="adj-pm">±</span>' +
          '<input type="number" class="row-adj" data-idx="' + (i - 1) + '" value="' +
          (rowAdjustments[i - 1] || '') + '" placeholder="0"><span class="adj-unit">分</span>' +
          '<span class="adj-sign">' + signText + '</span></div>'
        : '';
      html += '<div class="detail-row"><div class="detail-row-main"><span class="detail-label">' + label +
        '</span><span class="detail-time">' + formatClockKanji(rowT) + '</span>' + plusText + '</div>' +
        formulaHtml + adjInput + '</div>';
    }
    listEl.innerHTML = html;
  }

  function openDetailModal() {
    if (!lastMultiply) return;
    document.getElementById('modal-formula').textContent = historyText;
    const startInput = document.getElementById('detail-start');
    if (!startInput.value) startInput.value = '00:00';
    renderDetailList();
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeDetailModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  document.querySelectorAll('button.num').forEach(btn => {
    btn.addEventListener('click', () => pressDigit(btn.textContent));
  });
  document.getElementById('btn-clear').addEventListener('click', reset);
  document.getElementById('btn-back').addEventListener('click', pressBack);
  document.getElementById('btn-mul').addEventListener('click', () => pressOp('×'));
  document.getElementById('btn-div').addEventListener('click', () => pressOp('÷'));
  document.getElementById('btn-add').addEventListener('click', () => pressOp('+'));
  document.getElementById('btn-sub').addEventListener('click', () => pressOp('−'));
  document.getElementById('btn-eq').addEventListener('click', pressEqual);
  document.getElementById('btn-h').addEventListener('click', pressUnitHour);
  document.getElementById('btn-m').addEventListener('click', pressUnitMinute);
  document.getElementById('btn-s').addEventListener('click', pressUnitSecond);
  document.getElementById('btn-detail').addEventListener('click', openDetailModal);
  document.getElementById('modal-close').addEventListener('click', closeDetailModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeDetailModal();
  });
  document.getElementById('detail-start').addEventListener('input', renderDetailList);
  document.getElementById('detail-adjust').addEventListener('input', renderDetailList);
  document.getElementById('detail-list').addEventListener('change', (e) => {
    if (!e.target.classList.contains('row-adj')) return;
    const idx = parseInt(e.target.dataset.idx, 10);
    rowAdjustments[idx] = parseInt(e.target.value, 10) || 0;
    renderDetailList();
  });

  updateDetailButton();
  updateDisplay();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
